<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — ResumeCraft</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <!-- Top Navigation -->
  <nav class="navbar navbar-expand-lg navbar-resumecraft">
    <div class="container">
      <a class="navbar-brand navbar-brand-logo" href="/index.html">
        <div class="brand-icon"><i class="bi bi-file-earmark-person-fill"></i></div>
        Resume<span class="brand-accent">Craft</span>
      </a>
      <div class="ms-auto">
        <span class="text-muted small me-2">Already have an account?</span>
        <a href="/login.html" class="btn btn-sm btn-outline-primary">Log In</a>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5 col-sm-8">
        <div class="card-custom p-4 p-md-5 bg-white">
          <div class="text-center mb-4">
            <h3 class="fw-bold">Create Free Account</h3>
            <p class="text-muted small">Join ResumeCraft to start building professional ATS-optimized resumes.</p>
          </div>

          <div id="auth-alert" class="alert d-none"></div>

          <form id="register-form">
            <div class="mb-3">
              <label for="full_name" class="form-label fw-semibold small">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="full_name" placeholder="Gayathri Budarpu" required autocomplete="name">
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label fw-semibold small">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" placeholder="student@university.edu" required autocomplete="email">
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label fw-semibold small">Password (Min 6 chars)</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="new-password">
                <button class="btn btn-outline-secondary password-toggle-btn" type="button" data-target="password">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
              <!-- Strength meter -->
              <div class="progress mt-2" style="height: 5px;">
                <div id="password-strength-bar" class="progress-bar" role="progressbar" style="width: 0%"></div>
              </div>
              <div id="password-strength-text" class="small text-muted mt-1"></div>
            </div>

            <div class="mb-4">
              <label for="confirm_password" class="form-label fw-semibold small">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                <input type="password" class="form-control" id="confirm_password" placeholder="••••••••" required autocomplete="new-password">
                <button class="btn btn-outline-secondary password-toggle-btn" type="button" data-target="confirm_password">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <button type="submit" class="btn btn-resumecraft-primary w-100 py-2">
              Create Account <i class="bi bi-arrow-right ms-2"></i>
            </button>
          </form>

          <div class="mt-4 text-center small text-muted">
            By signing up, your session is securely encrypted with bcrypt & MySQL persistence.
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center text-muted small py-3 mt-auto">
    &copy; 2026 ResumeCraft &bull; College Web Technologies Project
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
