<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — ResumeCraft</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <!-- Top Navigation -->
  <nav class="navbar navbar-expand-lg navbar-resumecraft">
    <div class="container">
      <a class="navbar-brand navbar-brand-logo" href="/index.html">
        <div class="brand-icon"><i class="bi bi-file-earmark-person-fill"></i></div>
        Resume<span class="brand-accent">Craft</span>
      </a>
      <div class="ms-auto">
        <span class="text-muted small me-2">Don't have an account?</span>
        <a href="/register.html" class="btn btn-sm btn-outline-primary">Sign Up</a>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5 col-sm-8">
        <div class="card-custom p-4 p-md-5 bg-white">
          <div class="text-center mb-4">
            <h3 class="fw-bold">Welcome Back</h3>
            <p class="text-muted small">Sign in to your ResumeCraft dashboard to manage your resumes and career applications.</p>
          </div>

          <div id="auth-alert" class="alert d-none"></div>

          <form id="login-form">
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold small">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" placeholder="name@domain.com" required autocomplete="email">
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between">
                <label for="password" class="form-label fw-semibold small">Password</label>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="current-password">
                <button class="btn btn-outline-secondary password-toggle-btn" type="button" data-target="password">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <button type="submit" class="btn btn-resumecraft-primary w-100 py-2 mt-2">
              Log In <i class="bi bi-arrow-right ms-2"></i>
            </button>
          </form>

          <div class="mt-4 p-3 bg-light rounded text-center small text-muted">
            <div class="fw-semibold text-dark mb-1"><i class="bi bi-info-circle me-1 text-primary"></i> Faculty & Viva Evaluation Demo</div>
            <div>Email: <strong class="text-primary">demo@resumecraft.com</strong></div>
            <div>Password: <strong class="text-primary">Demo@123</strong></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center text-muted small py-3 mt-auto">
    &copy; 2026 ResumeCraft &bull; College Web Technologies Project
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
